# /opt/letters/compose.yaml on VM 104 `webhost` (192.168.88.5). See README.md.
#
# The app port binds loopback: the webhost's Caddy proxies to it, as it does
# for the bookshop. The metrics port is published on the LAN address for
# Prometheus (VM 107) and fenced with a DOCKER-USER rule.
services:
  letters:
    # After the first `docker compose pull`, pin to the digest it reports:
    #   image: ghcr.io/aaronjmccoy/portfolio-letters@sha256:...
    image: ghcr.io/aaronjmccoy/portfolio-letters:latest
    container_name: letters
    restart: unless-stopped
    environment:
      LETTERS_SCANS_DIR: /archive
      LETTERS_PHOTOS_DIR: /photos
      LETTERS_DATA_DIR: /data
    volumes:
      # The scans are one level down from the old site's root, beside its img/ folder.
      - /srv/www/germanwarletters.com/public/german-war-letters:/archive:ro
      - /srv/www/germanwarletters.com/public/img:/photos:ro
      - /srv/letters-data:/data
    ports:
      - '127.0.0.1:3001:3001'
      - '192.168.88.5:9465:9465'
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
