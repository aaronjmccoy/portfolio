name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Public Storefront token: safe in a browser, so safe in CI; the shop's smoke and e2e need a live store.
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
      SHOPIFY_STOREFRONT_API_VERSION: '2026-10'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

  e2e:
    runs-on: ubuntu-latest
    # Public Storefront token: safe in a browser, so safe in CI; the shop's smoke and e2e need a live store.
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
      SHOPIFY_STOREFRONT_API_VERSION: '2026-10'
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm -r --if-present e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: '**/playwright-report/'
          retention-days: 14

  # Builds the letters image, boots it and checks a rendered page, then (on
  # main) publishes it to GHCR for VM 104 to pull. See apps/letters/deploy.
  image-letters:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio-letters
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/letters/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and render a page
        run: |
          docker run -d --name letters -p 3001:3001 "$IMAGE:ci"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3001/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:3001/letter/440 | grep -q '<title>Letter 440'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/letter/nope)" = 404
          docker logs letters
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/letters/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
